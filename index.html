<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>TURBODROP | АВТО</title>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Добавляем стили для изображений -->
    <style>
        .car-image {
            width: 200px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        
        .car-image:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="av" id="lv" data-t="menu"></div>
        <h1 id="ttl"></h1>
        <div class="pill" id="mo"></div>
    </header>
    
    <main id="main">
        </main>
    
    <nav id="tabs">
        <button data-t="garage">Гараж</button>
        <button data-t="cases">Кейсы</button>
        <button data-t="games">Игры</button>
        <button data-t="menu">Меню</button>
    </nav>
    
    <div id="ov"></div>
    <div id="race"></div>
    <div id="toast" role="status"></div>
    
    <!-- Добавляем новый скрипт для работы с изображениями -->
    <script src="images.js?v=5"></script>
    <script src="game.js?v=9"></script>
</body>
</html>
